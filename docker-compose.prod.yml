# 운영 환경용 docker-compose
services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: car-service-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-car_db}
      MYSQL_USER: ${PROD_DB_USERNAME}
      MYSQL_PASSWORD: ${PROD_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - car-service-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 운영 환경 애플리케이션
  car-service:
    image: car-service:latest 
    container_name: car-service-prod
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - DB_URL=${PROD_DB_URL}
      - DB_USERNAME=${PROD_DB_USERNAME}
      - DB_PASSWORD=${PROD_DB_PASSWORD}
      - SERVER_PORT=${SERVER_PORT:-8080}
    volumes:
      - ./logs:/logs
    networks:
      - car-service-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${SERVER_PORT:-8080}/api/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  car-service-network:
    driver: bridge

volumes:
  mysql_prod_data:
    driver: local
