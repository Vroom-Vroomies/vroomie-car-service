# 테스트 환경 설정
spring:
  # 데이터소스 설정
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5  # 테스트 환경은 적은 커넥션 풀
      
  # JPA 설정
  jpa:
    show-sql: true  # 테스트에서는 SQL 로깅 활성화
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Flyway 설정
  flyway:
    baseline-on-migrate: true

# 서버 설정
server:
  port: 8080

# 테스트용 로그 설정
logging:
  level:
    com.vroomie.car_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO

# Swagger 설정
springdoc:
  swagger-ui:
    display-request-duration: true

# 액추에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always