# 운영 환경 설정
spring:
  # 데이터소스 설정
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20  # 운영 환경은 더 많은 커넥션 풀
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      
  # JPA 설정 
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false  # 운영 환경에서는 SQL 로깅 비활성화
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        
  # Flyway 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

# 서버 설정
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  http2:
    enabled: true
  # 운영 환경 서버 최적화
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000
    max-connections: 8192

# 운영용 로그 설정
logging:
  level:
    root: WARN
    com.vroomie.car_service: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  file:
    name: /logs/car-service.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# Swagger 비활성화 (운영 환경에서는 보안상 비활성화)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 액추에이터 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info  # 최소한의 엔드포인트만 노출
  endpoint:
    health:
      show-details: never