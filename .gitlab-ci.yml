# Car Service GitLab CI/CD Pipeline

stages:
  - test
  - build
  - deploy-prod

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  SERVICE_NAME: "car-service"
  DOCKER_IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH"

# 캐시 설정
cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

# 테스트 단계
test:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  services:
    - name: mysql:8.0
      alias: mysql
      command:
        ["--default-authentication-plugin=mysql_native_password", "--skip-ssl"]
  variables:
    MYSQL_ROOT_PASSWORD: "test"
    MYSQL_DATABASE: "car_service_test"
    MYSQL_USER: "testuser"
    MYSQL_PASSWORD: "testpass"
    SPRING_PROFILES_ACTIVE: "test"
    DB_URL: "jdbc:mysql://mysql:3306/car_service_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    DB_USERNAME: "testuser"
    DB_PASSWORD: "testpass"
  script:
    - sleep 30
    - chmod +x ./gradlew
    - ./gradlew clean test --info
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/*.xml
    paths:
      - build/reports/tests/test/
    expire_in: 1 week
  coverage: "/Total.*?([0-9]{1,3})%/"
  only:
    - merge_requests
    - main
    - develop

# 빌드 단계
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_BUILDKIT: 1
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - apk add --no-cache git
  script:
    - docker run --rm -v "$PWD":/app -w /app eclipse-temurin:17-jdk-alpine sh -c "
      chmod +x ./gradlew &&
      ./gradlew clean build -x test
      "
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        IMAGE_TAG="prod-$CI_COMMIT_SHORT_SHA"
        ENVIRONMENT="prod"
      elif [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        IMAGE_TAG="test-$CI_COMMIT_SHORT_SHA"
        ENVIRONMENT="test"
      else
        IMAGE_TAG="branch-$CI_COMMIT_SHORT_SHA"
        ENVIRONMENT="test"
      fi
    - docker build -t "$DOCKER_IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$DOCKER_IMAGE_NAME:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker tag "$DOCKER_IMAGE_NAME:$IMAGE_TAG" "$DOCKER_IMAGE_NAME:latest"
        docker push "$DOCKER_IMAGE_NAME:latest"
      fi
    - echo "IMAGE_TAG=$IMAGE_TAG" > build.env
    - echo "ENVIRONMENT=$ENVIRONMENT" >> build.env
    - echo "DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME" >> build.env

  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env
    expire_in: 1 hour
  only:
    - merge_requests
    - main
    - develop

# 운영 환경 배포
deploy-prod:
  stage: deploy-prod
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "❌ SSH_PRIVATE_KEY 변수가 설정되지 않았습니다!"
        exit 1
      fi
    - |
      if echo "$SSH_PRIVATE_KEY" | head -n1 | grep -q "BEGIN"; then
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/ssh_key
      else
        echo "$SSH_PRIVATE_KEY" | base64 -d > /tmp/ssh_key
      fi
      if [ ! -s /tmp/ssh_key ]; then
        echo "❌ SSH 키 파일이 비어있습니다!"
        exit 1
      fi
      chmod 600 /tmp/ssh_key
      ssh-add /tmp/ssh_key
      rm /tmp/ssh_key
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 700 ~/.ssh
  script:
    - |
      if [ -z "$SSH_USER" ] || [ -z "$PROD_SERVER_HOST" ]; then
        echo "❌ SSH_USER 또는 PROD_SERVER_HOST 변수가 설정되지 않았습니다!"
        exit 1
      fi
    - ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $SSH_USER@$PROD_SERVER_HOST "echo '✅ SSH 연결 성공'"
    - |
      ssh $SSH_USER@$PROD_SERVER_HOST << EOF
        export MYSQL_ROOT_PASSWORD='$MYSQL_ROOT_PASSWORD'
        export MYSQL_DATABASE='$MYSQL_DATABASE'
        export PROD_DB_URL='$PROD_DB_URL'
        export PROD_DB_USERNAME='$PROD_DB_USERNAME'
        export PROD_DB_PASSWORD='$PROD_DB_PASSWORD'
        export SERVER_PORT='$SERVER_PORT'
        export JAVA_OPTS='$JAVA_OPTS'
        
        cd /home/ubuntu
        
        if [ -d "car-service" ]; then
          sudo chown -R ubuntu:ubuntu car-service || true
          sudo chmod -R 755 car-service || true
          rm -rf car-service || true
        fi
        
        if [ -d "vroomie-car-service" ]; then
          sudo chown -R ubuntu:ubuntu vroomie-car-service || true
          sudo chmod -R 755 vroomie-car-service || true
          rm -rf vroomie-car-service || true
        fi
        
        mkdir -p car-service
        cd car-service
        
        if [ "$(ls -A .)" ]; then
          rm -rf .git ./* ./.* 2>/dev/null || true
        fi
        
        git clone https://gitlab-ci-token:$CI_JOB_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git .
        
        if [ $? -ne 0 ]; then
          echo "❌ Git clone 실패!"
          exit 1
        fi
        
        if [ ! -f "docker-compose.prod.yml" ]; then
          echo "❌ docker-compose.prod.yml 파일을 찾을 수 없습니다!"
          exit 1
        fi
        
        export MYSQL_ROOT_PASSWORD="\$MYSQL_ROOT_PASSWORD"
        export MYSQL_DATABASE="\$MYSQL_DATABASE"
        export PROD_DB_URL="\$PROD_DB_URL"
        export PROD_DB_USERNAME="\$PROD_DB_USERNAME"
        export PROD_DB_PASSWORD="\$PROD_DB_PASSWORD"
        export SERVER_PORT="\$SERVER_PORT"
        export JAVA_OPTS="\$JAVA_OPTS"
        
        cd /home/ubuntu/car-service
        
        docker-compose -f docker-compose.prod.yml down -v --remove-orphans || true
        docker ps -a | grep -E "(car-service|mysql)" | awk '{print \$1}' | xargs -r docker rm -f || true
        docker volume rm car-service_mysql_prod_data || true
        docker volume ls | grep mysql | awk '{print \$2}' | xargs -r docker volume rm || true
        docker system prune -f || true
        
        echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
        docker pull $DOCKER_IMAGE_NAME:$IMAGE_TAG
        docker tag $DOCKER_IMAGE_NAME:$IMAGE_TAG car-service:latest
        
        cd /home/ubuntu/car-service
        
        echo "MYSQL_ROOT_PASSWORD=\$MYSQL_ROOT_PASSWORD" > .env
        echo "MYSQL_DATABASE=\$MYSQL_DATABASE" >> .env
        echo "PROD_DB_URL=\$PROD_DB_URL" >> .env
        echo "PROD_DB_USERNAME=\$PROD_DB_USERNAME" >> .env
        echo "PROD_DB_PASSWORD=\$PROD_DB_PASSWORD" >> .env
        echo "SERVER_PORT=\$SERVER_PORT" >> .env
        echo "JAVA_OPTS=\$JAVA_OPTS" >> .env
        
        sleep 5
        docker-compose -f docker-compose.prod.yml up -d
        sleep 10
        
        sleep 20
        cd /home/ubuntu/car-service
        docker-compose -f docker-compose.prod.yml ps -a
      EOF

    - echo "✅ 배포 완료!"
  environment:
    name: production
    url: https://car-service.vroomie.com
  only:
    - main
  when: manual
  allow_failure: false
