# Car Service GitHub Actions CI/CD Pipeline

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, test ]
  pull_request:
    branches: [ main, develop, test ]

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

env:
  DOCKER_BUILDKIT: 1
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  SERVICE_NAME: "car-service"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: car_service_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Wait for MySQL
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client
        for i in {60..0}; do
          if mysqladmin ping -h"127.0.0.1" -P3306 -uroot -ptest --silent; then
            echo 'MySQL is ready!'
            break
          fi
          echo 'MySQL init process in progress...'
          sleep 2
        done
        if [ "$i" = 0 ]; then
          echo >&2 'MySQL init process failed.'
          exit 1
        fi
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Run tests
      env:
        SPRING_PROFILES_ACTIVE: test
        DB_URL: jdbc:mysql://localhost:3306/car_service_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        DB_USERNAME: testuser
        DB_PASSWORD: testpass
      run: |
        ./gradlew clean test --info
        echo "Tests completed with exit code: $?"
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          build/test-results/test/*.xml
          build/reports/tests/test/
        retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      environment: ${{ steps.set-env.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Build with Gradle
      run: ./gradlew clean build -x test
    
    - name: Set environment and image tag
      id: set-env
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "IMAGE_TAG=prod-${{ github.sha }}" >> $GITHUB_ENV
          echo "environment=production" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref_name }}" = "develop" ]; then
          echo "IMAGE_TAG=test-${{ github.sha }}" >> $GITHUB_ENV
          echo "environment=test" >> $GITHUB_OUTPUT
        else
          echo "IMAGE_TAG=branch-${{ github.sha }}" >> $GITHUB_ENV
          echo "environment=test" >> $GITHUB_OUTPUT
        fi
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ env.IMAGE_TAG }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    environment: 
      name: production
      url: https://car-service.vroomie.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        
        # SSH 키 저장 및 검증
        echo "Setting up SSH key..."
        echo "Detected Base64 encoded key"
        if ! echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa 2>/dev/null; then
          echo "❌ Base64 디코딩 실패! 키가 올바른 base64 형식인지 확인하세요."
          exit 1
        fi
        
        chmod 600 ~/.ssh/id_rsa
        
        # 키 파일 크기 확인
        echo "SSH key file size: $(wc -c < ~/.ssh/id_rsa) bytes"
        echo "SSH key first line: $(head -n1 ~/.ssh/id_rsa)"
        echo "SSH key last line: $(tail -n1 ~/.ssh/id_rsa)"
        
        # SSH 키 검증
        echo "Validating SSH key format..."
        if ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1; then
          echo "✅ SSH key format is valid"
        else
          echo "❌ SSH key format validation failed"
          echo "Key type detection:"
          file ~/.ssh/id_rsa
          exit 1
        fi
        
        # known_hosts 설정
        if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
        fi
        
        # SSH 에이전트 시작
        echo "Starting SSH agent..."
        eval $(ssh-agent -s)
        echo "Adding key to SSH agent..."
        ssh-add ~/.ssh/id_rsa
    
    - name: Test SSH connection
      run: |
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} "echo '✅ SSH 연결 성공'"
    
    - name: Deploy to production server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
          export MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'
          export MYSQL_DATABASE='${{ secrets.MYSQL_DATABASE }}'
          export PROD_DB_URL='${{ secrets.PROD_DB_URL }}'
          export PROD_DB_USERNAME='${{ secrets.PROD_DB_USERNAME }}'
          export PROD_DB_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}'
          export SERVER_PORT='${{ secrets.SERVER_PORT }}'
          export JAVA_OPTS='${{ secrets.JAVA_OPTS }}'
          
          cd /home/ubuntu
          
          # Clean up existing directories
          if [ -d "car-service" ]; then
            sudo chown -R ubuntu:ubuntu car-service || true
            sudo chmod -R 755 car-service || true
            rm -rf car-service || true
          fi
          
          if [ -d "vroomie-car-service" ]; then
            sudo chown -R ubuntu:ubuntu vroomie-car-service || true
            sudo chmod -R 755 vroomie-car-service || true
            rm -rf vroomie-car-service || true
          fi
          
          # Create new directory and clone repository
          mkdir -p car-service
          cd car-service
          
          if [ "$(ls -A .)" ]; then
            rm -rf .git ./* ./.* 2>/dev/null || true
          fi
          
          git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .
          
          if [ $? -ne 0 ]; then
            echo "❌ Git clone 실패!"
            exit 1
          fi
          
          echo "✅ 현재 브랜치: ${{ github.ref_name }}"
          echo "✅ 현재 커밋: ${{ github.sha }}"
          git log -1 --oneline
          
          if [ ! -f "docker-compose.prod.yml" ]; then
            echo "❌ docker-compose.prod.yml 파일을 찾을 수 없습니다!"
            exit 1
          fi
          
          # Stop existing containers and clean up
          cd /home/ubuntu/car-service
          echo "🛑 기존 컨테이너 중지 중..."
          docker-compose -f docker-compose.prod.yml down --remove-orphans || true
          
          # 기존 car-service 이미지 제거 (MySQL 데이터는 보존)
          docker rmi car-service:latest || true
          docker image prune -f || true
          
          # Login to GitHub Container Registry and pull latest image
          echo "🔐 GitHub Container Registry 로그인..."
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "📥 새로운 Docker 이미지 다운로드 중..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }} car-service:latest
          
          echo "🏷️  이미지 태그 확인:"
          docker images | grep car-service
          
          # Create environment file
          echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" > .env
          echo "MYSQL_DATABASE=$MYSQL_DATABASE" >> .env
          echo "PROD_DB_URL=$PROD_DB_URL" >> .env
          echo "PROD_DB_USERNAME=$PROD_DB_USERNAME" >> .env
          echo "PROD_DB_PASSWORD=$PROD_DB_PASSWORD" >> .env
          echo "SERVER_PORT=$SERVER_PORT" >> .env
          echo "JAVA_OPTS=$JAVA_OPTS" >> .env
          
          # Deploy with docker-compose
          echo "🚀 새로운 컨테이너 시작 중..."
          sleep 5
          docker-compose -f docker-compose.prod.yml up -d
          sleep 15
          
          # Wait for services to be ready and verify deployment
          echo "⏳ 서비스 준비 대기 중..."
          sleep 20
          
          echo "📊 컨테이너 상태 확인:"
          docker-compose -f docker-compose.prod.yml ps -a
          
          echo "🔍 car-service 컨테이너 로그 (최신 10줄):"
          docker logs car-service-prod --tail 10
          
          echo "✅ 배포된 이미지 정보:"
          docker inspect car-service:latest | grep -A 5 "Created\|RepoTags"
        EOF
    
    - name: Deployment completed
      run: echo "✅ 배포 완료!"