# 개발 환경용 docker-compose

services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: dev-vroomie-db
    env_file:
      - ../vroomie-config/.env.development
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    command: --default-authentication-plugin=caching_sha2_password
    networks:
      - car-service-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 개발 환경 애플리케이션
  car-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-vroomie-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    env_file:
      - ../vroomie-config/.env.development
    volumes:
      - ./logs:/logs
      - .:/app
    working_dir: /app
    networks:
      - car-service-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: quay.io/minio/minio:latest
    container_name: dev-vroomie-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - car-service-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  car-service-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
  minio_dev_data:
    driver: local